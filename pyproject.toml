[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:backend.*"]

[tool.ruff]
# The Yahoo batch-quote parser builds wide conditional-spread literals. They
# are dense but correct, so the limit accommodates them rather than forcing a
# rewrite of working parsing code.
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "DTZ"]
